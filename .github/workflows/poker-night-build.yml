name: Build Poker Night APK
on:
  push:
    branches:
      - poker-night-native
    paths:
      - .github/workflows/poker-night-build.yml
      - poker_build/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Poker Night v2
        shell: bash
        run: |
          cat poker_build/v2_01.b64 poker_build/v2_02.b64 poker_build/v2_03.b64 poker_build/v2_04.b64 poker_build/v2_05.b64 poker_build/v2_06.b64 | base64 -d > /tmp/poker_android_v2.zip
          unzip -q /tmp/poker_android_v2.zip
      - name: Build APK
        run: |
          cd poker_android
          gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PokerNight-v2-APK
          path: poker_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
