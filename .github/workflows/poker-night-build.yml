name: Build Poker Night APK
on:
  push:
    branches:
      - poker-night-native
    paths:
      - .github/workflows/poker-night-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore project
        shell: bash
        run: |
          cat > /tmp/poker_android.b64 <<'B64'

B64
          base64 -d /tmp/poker_android.b64 > /tmp/poker_android.zip
          cd "$GITHUB_WORKSPACE"
          unzip -q /tmp/poker_android.zip
      - name: Build APK
        run: |
          cd poker_android
          gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PokerNight-APK
          path: poker_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
